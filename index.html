<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1120">
<title>Greek B1 Exam — Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b1120;
    --surface: #151f32;
    --surface-2: #1e293b;
    --border: #2dd4bf33;
    --card-border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #2dd4bf;
    --green: #22c55e;
    --red: #f43f5e;
    --amber: #f59e0b;
    --safe-bottom: env(safe-area-inset-bottom, 12px);
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* HEADER */
  header {
    padding: 10px 14px 8px;
    background: rgba(11, 17, 32, 0.96);
    border-bottom: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.02em;
  }
  .streak-pill {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fbbf24;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn {
    background: var(--surface-2);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .icon-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(56, 189, 248, 0.14);
  }

  /* PROGRESS BAR */
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    gap: 8px;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
    display: flex;
  }
  .progress-fill-known {
    background: var(--green);
    height: 100%;
    transition: width 0.25s ease;
  }
  .progress-fill-hard {
    background: var(--red);
    height: 100%;
    transition: width 0.25s ease;
  }

  /* MODULE CHIPS */
  .chips-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chips-scroll::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--surface);
    border: 1px solid #1e293b;
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip.active {
    background: rgba(56, 189, 248, 0.16);
    border-color: var(--accent);
    color: #fff;
  }

  /* MAIN AREA */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 14px;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* SWIPE CARD */
  .swipe-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: 430px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .flashcard {
    width: 100%;
    height: 100%;
    background: linear-gradient(165deg, #19253a 0%, #111928 100%);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    position: relative;
    touch-action: pan-y;
    transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }
  .card-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cat-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: rgba(56, 189, 248, 0.12);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .speak-btn {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .speak-btn:active { transform: scale(0.92); }

  .word-main {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.25;
    color: #ffffff;
    margin: 8px 0 4px;
    word-break: break-word;
  }
  .word-grammar {
    font-size: 13px;
    color: #fbbf24;
    font-weight: 600;
    background: rgba(245, 158, 11, 0.12);
    padding: 3px 10px;
    border-radius: 8px;
    margin-top: 4px;
  }
  .divider {
    width: 56px;
    height: 2px;
    background: #334155;
    margin: 8px auto;
  }
  .reveal-zone {
    width: 100%;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .word-translation {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-2);
    line-height: 1.3;
  }
  .word-example {
    font-size: 13.5px;
    color: #e2e8f0;
    background: rgba(11, 17, 32, 0.65);
    border-left: 3px solid var(--accent);
    padding: 9px 12px;
    border-radius: 10px;
    line-height: 1.35;
    width: 100%;
    text-align: left;
  }
  .tap-hint {
    font-size: 13px;
    color: var(--muted);
    padding: 16px;
    border: 1px dashed #334155;
    border-radius: 14px;
    width: 90%;
  }

  /* SWIPE ACTION BUTTONS */
  .swipe-controls {
    display: flex;
    gap: 10px;
    padding: 6px 14px 8px;
  }
  .big-btn {
    flex: 1;
    padding: 15px 10px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 800;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.1s ease;
  }
  .big-btn:active { transform: scale(0.96); }
  .btn-hard {
    background: rgba(244, 63, 94, 0.16);
    color: #fda4af;
    border: 1px solid rgba(244, 63, 94, 0.4);
  }
  .btn-easy {
    background: rgba(34, 197, 94, 0.18);
    color: #86efac;
    border: 1px solid rgba(34, 197, 94, 0.45);
  }

  /* QUIZ MODE */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 18px 16px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .quiz-btn {
    background: var(--surface-2);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 14px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    line-height: 1.25;
    transition: all 0.12s ease;
  }
  .quiz-btn.correct {
    background: rgba(34, 197, 94, 0.22);
    border-color: var(--green);
    color: #86efac;
  }
  .quiz-btn.wrong {
    background: rgba(244, 63, 94, 0.22);
    border-color: var(--red);
    color: #fda4af;
  }

  /* MATCH GAME MODE */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
  }
  .match-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .match-tile {
    background: var(--surface);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 12px 10px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    line-height: 1.2;
    transition: all 0.15s ease;
  }
  .match-tile.selected {
    border-color: var(--accent);
    background: rgba(56, 189, 248, 0.18);
    color: #fff;
  }
  .match-tile.matched {
    opacity: 0.2;
    pointer-events: none;
    border-color: var(--green);
  }
  .match-tile.error {
    border-color: var(--red);
    background: rgba(244, 63, 94, 0.22);
  }

  /* SEARCH / LIST & TEMPLATES */
  .list-container {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 12px;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    margin-bottom: 4px;
  }
  .vocab-item {
    background: var(--surface);
    border: 1px solid #1e293b;
    border-radius: 14px;
    padding: 11px 13px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .vocab-item-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .vocab-g { font-size: 15px; font-weight: 700; color: #fff; }
  .vocab-r { font-size: 13.5px; color: var(--accent-2); font-weight: 600; }
  .vocab-e { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* BOTTOM TAB BAR */
  nav.bottom-nav {
    background: rgba(11, 17, 32, 0.98);
    border-top: 1px solid #1e293b;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 6px 6px calc(6px + var(--safe-bottom));
    z-index: 20;
  }
  .nav-tab {
    background: transparent;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 5px 2px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
  }
  .nav-tab span.icon { font-size: 17px; }
  .nav-tab.active {
    color: var(--accent);
    background: rgba(56, 189, 248, 0.1);
  }
</style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="brand">
      🇬🇷 <span>UCY B1 Тренажер</span>
      <span class="streak-pill" id="streakBadge">🔥 0</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="dirBtn" onclick="toggleDirection()" title="Направление перевода">EL→RU</button>
      <button class="icon-btn" id="ttsBtn" onclick="toggleAutoTTS()" title="Авто-озвучка">🔇 Звук</button>
    </div>
  </div>
  <div class="progress-row">
    <span>✅ Выучено: <b id="statKnown" style="color:var(--green)">0</b></span>
    <div class="progress-track">
      <div class="progress-fill-known" id="barKnown" style="width:0%"></div>
      <div class="progress-fill-hard" id="barHard" style="width:0%"></div>
    </div>
    <span>🔥 Повтор: <b id="statHard" style="color:var(--red)">0</b> / <b id="statTotal">0</b></span>
  </div>
  <div class="chips-scroll" id="moduleBar"></div>
</header>

<main id="mainContent"></main>

<div class="swipe-controls" id="swipeFooter">
  <button class="big-btn btn-hard" onclick="gradeCurrent(false)">👈 Еще учу</button>
  <button class="big-btn btn-easy" onclick="gradeCurrent(true)">Знаю 👉</button>
</div>

<nav class="bottom-nav">
  <button class="nav-tab active" id="tab-swipe" onclick="switchTab('swipe')">
    <span class="icon">🃏</span><span>Свайп</span>
  </button>
  <button class="nav-tab" id="tab-quiz" onclick="switchTab('quiz')">
    <span class="icon">⚡</span><span>Квиз 1/4</span>
  </button>
  <button class="nav-tab" id="tab-match" onclick="switchTab('match')">
    <span class="icon">🧩</span><span>Пары</span>
  </button>
  <button class="nav-tab" id="tab-templates" onclick="switchTab('templates')">
    <span class="icon">✍️</span><span>Шаблоны</span>
  </button>
  <button class="nav-tab" id="tab-list" onclick="switchTab('list')">
    <span class="icon">📚</span><span>Все слова</span>
  </button>
</nav>

<script>
// Инициализация Telegram Mini App SDK (если открыто внутри Telegram)
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  try { tg.expand(); } catch(e) {}
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e) {}
}
function haptic(type = 'light') {
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (type === 'success' || type === 'error' || type === 'warning') {
      tg.HapticFeedback.notificationOccurred(type);
    } else {
      tg.HapticFeedback.impactOccurred(type);
    }
  } catch(e) {}
}

// ПОЛНАЯ БАЗА ЛЕКСИКИ B1 (Κλικ B1 Главы 1–12 + Ελληνικά Β' UCY + Реальные экзамены UCY)
const VOCAB = [
  // ================= 1. ХАРАКТЕР, ЛИЧНОСТЬ, ОТНОШЕНИЯ (Гл. 1) =================
  {m:"1. Характер", g:"ευγενής (-ής, -ές) ≠ αγενής", f:"мн.ч. ср.р.: ευγενή / αγενή", r:"вежливый ≠ грубый", e:"Ο υπάλληλος ήταν πολύ αγενής απέναντί μας."},
  {m:"1. Характер", g:"συνεπής (-ής, -ές) ≠ ασυνεπής", f:"прил. на -ης/-ης/-ες", r:"пунктуальный, ответственный ≠ необязательный", e:"Είναι πάντα συνεπής στις υποχρεώσεις του."},
  {m:"1. Характер", g:"ειλικρινής (-ής, -ές)", f:"сущ.: η ειλικρίνεια", r:"искренний, честный", e:"Εκτιμώ ιδιαίτερα την ειλικρίνειά σου."},
  {m:"1. Характер", g:"υπεύθυνος ≠ ανεύθυνος", f:"сущ.: η ευθύνη (ответственность)", r:"ответственный ≠ безответственный", e:"Ζήτησα να μιλήσω με τον υπεύθυνο του καταστήματος."},
  {m:"1. Характер", g:"υπομονετικός / η υπομονή", f:"антоним: ανυπόμονος", r:"терпеливый / терпение", e:"Ειλικρινά, έχασα την υπομονή μου με αυτή την κατάσταση!"},
  {m:"1. Характер", g:"αισιόδοξος ≠ απαισιόδοξος", f:"сущ.: η αισιοδοξία", r:"оптимистичный ≠ пессимистичный", e:"Προσπαθώ να παραμένω αισιόδοξος παρά τις δυσκολίες."},
  {m:"1. Характер", g:"φιλόξενος / η φιλοξενία", f:"гл.: φιλοξενώ (принимать гостей)", r:"гостеприимный / гостеприимство", e:"Σας ευχαριστώ θερμά για την υπέροχη φιλοξενία σας."},
  {m:"1. Характер", g:"εργατικός ≠ τεμπέλης", f:"прил.", r:"трудолюбивый ≠ ленивый", e:"Είναι πολύ εργατικός και φιλόδοξος άνθρωπος."},
  {m:"1. Характер", g:"πεισματάρης (-α, -ικο)", f:"сущ.: το πείσμα", r:"упрямый", e:"Είναι πολύ πεισματάρης και δεν αλλάζει γνώμη εύκολα."},
  {m:"1. Характер", g:"ώριμος ≠ ανώριμος", f:"сущ.: η ωριμότητα", r:"зрелый, рассудительный ≠ незрелый", e:"Αντέδρασε με πολύ ώριμο τρόπο."},
  {m:"1. Характер", g:"γενναιόδωρος ≠ τσιγκούνης", f:"прил.", r:"щедрый ≠ скупой, жадный", e:"Είναι γενναιόδωρος και βοηθάει πάντα τους άλλους."},
  {m:"1. Характер", g:"η προσωπικότητα / ο χαρακτήρας", f:"сущ.", r:"личность / характер", e:"Έχει πολύ έντονη προσωπικότητα."},
  {m:"1. Характер", g:"η συμπεριφορά", f:"απαράδεκτη συμπεριφορά!", r:"поведение", e:"Η συμπεριφορά του προσωπικού ήταν εντελώς απαράδεκτη."},
  {m:"1. Характер", g:"η εξωτερική εμφάνιση", f:"гл.: εμφανίζομαι", r:"внешность (внешний вид)", e:"Δεν πρέπει να κρίνουμε κάποιον μόνο από την εμφάνιση."},
  {m:"1. Характер", g:"η εμπιστοσύνη", f:"έχω εμπιστοσύνη σε...", r:"доверие", e:"Του έχω απόλυτη εμπιστοσύνη."},
  {m:"1. Характер", g:"η παρεξήγηση", f:"гл.: παρεξηγώ / παρεξηγούμαι", r:"недоразумение, размолвка", e:"Έγινε μια μικρή παρεξήγηση, αλλά λύθηκε αμέσως."},
  {m:"1. Характер", g:"το προτέρημα ≠ το ελάττωμα", f:"прил.: ελαττωματικός (бракованный)", r:"достоинство ≠ недостаток (дефект)", e:"Κάθε άνθρωπος έχει τα προτερήματα και τα ελαττώματά του."},
  {m:"1. Характер", g:"το χάσμα γενεών / η εφηβεία", f:"ο έφηβος (подросток)", r:"конфликт поколений / подростковый возраст", e:"Συχνά υπάρχει χάσμα γενεών ανάμεσα σε γονείς και εφήβους."},
  {m:"1. Характер", g:"η εντύπωση (κάνω εντύπωση)", f:"θετική / αρνητική εντύπωση", r:"впечатление (производить впечатление)", e:"Μου έκανε πολύ καλή εντύπωση από την πρώτη στιγμή."},
  {m:"1. Характер", g:"η διάθεση", f:"είμαι σε καλή/κακή διάθεση", r:"настроение, расположение духа", e:"Δεν έχω καθόλου διάθεση να βγω απόψε."},

  // ================= 2. ЖИЛЬЕ, ПЕРЕЕЗД, БЫТ И РАЙОН (Гл. 2) =================
  {m:"2. Жилье и переезд", g:"η μετακόμιση / μετακομίζω", f:"Аорист: μετακόμισα", r:"переезд / переезжать", e:"Την περασμένη εβδομάδα μετακόμισα σε καινούργιο διαμέρισμα."},
  {m:"2. Жилье и переезд", g:"η μεταφορική εταιρεία", f:"тема эссе UCY Сентябрь 2026!", r:"транспортная компания (перевозчики)", e:"Αντιμετώπισα σοβαρό πρόβλημα με τη μεταφορική εταιρεία."},
  {m:"2. Жилье и переезд", g:"το ενοίκιο / νοικιάζω", f:"Аорист: νοίκιασα", r:"арендная плата / снимать (сдавать) жилье", e:"Το ενοίκιο είναι αρκετά υψηλό σε αυτή την περιοχή."},
  {m:"2. Жилье и переезд", g:"ο ιδιοκτήτης / ο ενοικιαστής", f:"сущ.", r:"владелец (хозяин) / арендатор", e:"Επικοινώνησα με τον ιδιοκτήτη για τη βλάβη."},

// Storage: status map { [greekWord]: 'known' | 'hard' } + custom user words
// Синхронизируется одновременно в localStorage И в облаке Telegram (Telegram.WebApp.CloudStorage)!
let statusMap = {};
let customVocab = [];

function wordHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}

try {
  statusMap = JSON.parse(localStorage.getItem('ucy_b1_status_v2') || '{}');
  customVocab = JSON.parse(localStorage.getItem('ucy_b1_custom_v1') || '[]');
  if (customVocab.length) VOCAB.unshift(...customVocab);
} catch(e) { statusMap = {}; customVocab = []; }

// Загрузка из облака Telegram при старте (привязано к твоему аккаунту Telegram!)
function initCloudSync() {
  if (!tg || !tg.CloudStorage) return;
  try {
    tg.CloudStorage.getItems(['ucy_b1_cloud_v1', 'ucy_b1_custom_v1'], (err, values) => {
      if (err || !values) return;
      let updated = false;
      if (values.ucy_b1_custom_v1) {
        try {
          const cloudCustom = JSON.parse(values.ucy_b1_custom_v1);
          if (Array.isArray(cloudCustom) && cloudCustom.length > customVocab.length) {
            customVocab = cloudCustom;
            localStorage.setItem('ucy_b1_custom_v1', JSON.stringify(customVocab));
            // Добавим недостающие пользовательские слова
            cloudCustom.forEach(cw => {
              if (!VOCAB.some(v => v.g === cw.g)) VOCAB.unshift(cw);
            });
            updated = true;
          }
        } catch(e) {}
      }
      if (values.ucy_b1_cloud_v1) {
        try {
          const compact = JSON.parse(values.ucy_b1_cloud_v1); // { k: [...hashes], h: [...hashes] }
          const kSet = new Set(compact.k || []);
          const hSet = new Set(compact.h || []);
          VOCAB.forEach(v => {
            const id = wordHash(v.g);
            if (kSet.has(id)) { statusMap[v.g] = 'known'; updated = true; }
            else if (hSet.has(id)) { statusMap[v.g] = 'hard'; updated = true; }
          });
          if (updated) {
            localStorage.setItem('ucy_b1_status_v2', JSON.stringify(statusMap));
            renderModules();
            renderMain(true);
          }
        } catch(e) {}
      }
    });
  } catch(e) {}
}

function saveStatus() {
  try {
    localStorage.setItem('ucy_b1_status_v2', JSON.stringify(statusMap));
    localStorage.setItem('ucy_b1_custom_v1', JSON.stringify(customVocab));
  } catch(e) {}

  // Сохраняем компактный слепок в Telegram CloudStorage (работает даже при смене телефона/домена!)
  if (tg && tg.CloudStorage) {
    try {
      const k = [], h = [];
      VOCAB.forEach(v => {
        const st = statusMap[v.g];
        if (st === 'known') k.push(wordHash(v.g));
        else if (st === 'hard') h.push(wordHash(v.g));
      });
      tg.CloudStorage.setItem('ucy_b1_cloud_v1', JSON.stringify({ k, h }));
      tg.CloudStorage.setItem('ucy_b1_custom_v1', JSON.stringify(customVocab.slice(0, 40)));
    } catch(e) {}
  }
  updateHeaderStats();
}

function addCustomWordPrompt() {
  const g = prompt('Введи греческое слово или фразу (например: η προθεσμία):');
  if (!g || !g.trim()) return;
  const r = prompt('Перевод на русский:');
  if (!r || !r.trim()) return;
  const e = prompt('Пример или пометка (необязательно):') || 'Мое слово с урока';
  const newCard = { m: "⭐️ Мои слова", g: g.trim(), f: "свое слово", r: r.trim(), e: e.trim() };
  customVocab.unshift(newCard);
  VOCAB.unshift(newCard);
  if (!MODULES.includes("⭐️ Мои слова")) {
    MODULES.splice(2, 0, "⭐️ Мои слова");
  }
  saveStatus();
  renderModules();
  renderMain(true);
  haptic('success');
}

function backupProgressModal() {
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ s: statusMap, c: customVocab }))));
  const action = prompt(
    '💾 БЭКАП ПРОГРЕССА:\n\n• Чтобы СОХРАНИТЬ бэкап: скопируй код из поля ниже.\n• Чтобы ВОССТАНОВИТЬ: вставь сюда сохраненный код и нажми ОК.',
    payload
  );
  if (action && action.trim() && action.trim() !== payload) {
    try {
      const decoded = JSON.parse(decodeURIComponent(escape(atob(action.trim()))));
      if (decoded.s) statusMap = { ...statusMap, ...decoded.s };
      if (Array.isArray(decoded.c)) {
        customVocab = decoded.c;
        customVocab.forEach(cw => {
          if (!VOCAB.some(v => v.g === cw.g)) VOCAB.unshift(cw);
        });
      }
      saveStatus();
      renderModules();
      renderMain(true);
      alert('✅ Прогресс успешно восстановлен!');
    } catch(e) {
      alert('Ошибка: неверный код бэкапа.');
    }
  }
}

const MODULES = ['🔥 Умный микс', '❗️ Повторить', ...new Set(VOCAB.map(v => v.m)), 'Все подряд'];

function getActiveDeck() {
  if (activeModule === '❗️ Повторить') {
    const hard = VOCAB.filter(v => statusMap[v.g] === 'hard');
    if (hard.length) return hard;
    const unlearned = VOCAB.filter(v => statusMap[v.g] !== 'known');
    return unlearned.length ? unlearned : VOCAB;
  }
  if (activeModule === '🔥 Умный микс') {
    // Сначала 'hard', потом новые, в конце 'known'
    const hard = VOCAB.filter(v => statusMap[v.g] === 'hard');
    const fresh = VOCAB.filter(v => !statusMap[v.g]);
    const known = VOCAB.filter(v => statusMap[v.g] === 'known');
    return [...hard, ...fresh, ...known];
  }
  if (activeModule === 'Все подряд') return VOCAB;
  return VOCAB.filter(v => v.m === activeModule);
}

function speakGreek(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    // Очистим скобки и знаки неравенства для чистого чтения
    const clean = text.replace(/\([^)]*\)/g, '').replace(/[≠→/]/g, ', ');
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'el-GR';
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function updateHeaderStats() {
  let known = 0, hard = 0;
  VOCAB.forEach(v => {
    if (statusMap[v.g] === 'known') known++;
    else if (statusMap[v.g] === 'hard') hard++;
  });
  document.getElementById('statKnown').textContent = known;
  document.getElementById('statHard').textContent = hard;
  document.getElementById('statTotal').textContent = VOCAB.length;
  document.getElementById('barKnown').style.width = ((known / VOCAB.length) * 100).toFixed(1) + '%';
  document.getElementById('barHard').style.width = ((hard / VOCAB.length) * 100).toFixed(1) + '%';
  document.getElementById('streakBadge').textContent = `🔥 ${streak}`;
}

function renderModules() {
  const bar = document.getElementById('moduleBar');
  bar.innerHTML = MODULES.map(m =>
    `<button class="chip ${m === activeModule ? 'active' : ''}" onclick="selectModule('${m}')">${m}</button>`
  ).join('');
}

function selectModule(m) {
  haptic('light');
  activeModule = m;
  cardCursor = 0;
  revealed = false;
  renderModules();
  renderMain();
}

function toggleDirection() {
  haptic('light');
  dirELtoRU = !dirELtoRU;
  revealed = false;
  const btn = document.getElementById('dirBtn');
  btn.textContent = dirELtoRU ? 'EL→RU' : 'RU→EL';
  btn.classList.toggle('active', !dirELtoRU);
  renderMain();
}

function toggleAutoTTS() {
  haptic('light');
  autoTTS = !autoTTS;
  const btn = document.getElementById('ttsBtn');
  btn.textContent = autoTTS ? '🔊 Авто' : '🔇 Звук';
  btn.classList.toggle('active', autoTTS);
}

function switchTab(tab) {
  haptic('light');
  activeTab = tab;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('swipeFooter').style.display = tab === 'swipe' ? 'flex' : 'none';
  document.getElementById('moduleBar').style.display = (tab === 'templates') ? 'none' : 'flex';
  renderMain();
}

// ================= SWIPE MODE =================
function flipSwipeCard() {
  haptic('light');
  revealed = !revealed;
  renderMain(true);
}

function gradeCurrent(isKnown) {
  const deck = getActiveDeck();
  const item = deck[cardCursor % deck.length];
  if (isKnown) {
    statusMap[item.g] = 'known';
    streak++;
    haptic('success');
  } else {
    statusMap[item.g] = 'hard';
    streak = 0;
    haptic('warning');
  }
  saveStatus();
  revealed = false;
  cardCursor = (cardCursor + 1) % deck.length;
  renderMain();
}

function attachTouchSwipe(cardEl) {
  let startX = 0, currentX = 0, dragging = false;
  cardEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    currentX = startX;
    dragging = true;
    cardEl.style.transition = 'none';
  }, {passive: true});

  cardEl.addEventListener('touchmove', e => {
    if (!dragging) return;
    currentX = e.touches[0].clientX;
    const dx = currentX - startX;
    if (Math.abs(dx) > 12) {
      cardEl.style.transform = `translateX(${dx}px) rotate(${dx * 0.04}deg)`;
      cardEl.style.borderColor = dx > 40 ? 'var(--green)' : (dx < -40 ? 'var(--red)' : 'var(--card-border)');
    }
  }, {passive: true});

  cardEl.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    const dx = currentX - startX;
    cardEl.style.transition = 'transform 0.2s ease, border-color 0.2s ease';
    if (dx > 85) {
      cardEl.style.transform = 'translateX(120%) rotate(12deg)';
      setTimeout(() => gradeCurrent(true), 150);
    } else if (dx < -85) {
      cardEl.style.transform = 'translateX(-120%) rotate(-12deg)';
      setTimeout(() => gradeCurrent(false), 150);
    } else {
      cardEl.style.transform = 'none';
      cardEl.style.borderColor = 'var(--card-border)';
    }
  });
}

// ================= QUIZ 1 OF 4 =================
function handleQuizChoice(btn, isCorrect, greekKey) {
  const allBtns = document.querySelectorAll('.quiz-btn');
  allBtns.forEach(b => b.disabled = true);
  if (isCorrect) {
    btn.classList.add('correct');
    statusMap[greekKey] = 'known';
    streak++;
    haptic('success');
    saveStatus();
    if (autoTTS) speakGreek(greekKey);
    setTimeout(() => { cardCursor++; renderMain(); }, 650);
  } else {
    btn.classList.add('wrong');
    statusMap[greekKey] = 'hard';
    streak = 0;
    haptic('error');
    saveStatus();
    allBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('correct'); });
    setTimeout(() => { cardCursor++; renderMain(); }, 1450);
  }
}

// ================= MATCH GAME (ПАРЫ) =================
let matchState = { pairs: [], selectedLeft: null, selectedRight: null, matchedCount: 0 };

function initMatchRound() {
  const deck = getActiveDeck();
  const sample = [...deck].sort(() => Math.random() - 0.5).slice(0, 5);
  matchState = {
    left: [...sample].sort(() => Math.random() - 0.5),
    right: [...sample].sort(() => Math.random() - 0.5),
    selectedLeft: null,
    selectedRight: null,
    matchedKeys: new Set()
  };
}

function clickMatchTile(side, key) {
  haptic('light');
  if (matchState.matchedKeys.has(key)) return;
  if (side === 'left') {
    matchState.selectedLeft = (matchState.selectedLeft === key) ? null : key;
    if (autoTTS) speakGreek(key);
  } else {
    matchState.selectedRight = (matchState.selectedRight === key) ? null : key;
  }

  if (matchState.selectedLeft && matchState.selectedRight) {
    if (matchState.selectedLeft === matchState.selectedRight) {
      haptic('success');
      matchState.matchedKeys.add(matchState.selectedLeft);
      statusMap[matchState.selectedLeft] = 'known';
      streak++;
      saveStatus();
      matchState.selectedLeft = null;
      matchState.selectedRight = null;
      if (matchState.matchedKeys.size === matchState.left.length) {
        setTimeout(() => { initMatchRound(); renderMain(); }, 450);
        return;
      }
    } else {
      haptic('error');
      streak = 0;
      updateHeaderStats();
      const lKey = matchState.selectedLeft, rKey = matchState.selectedRight;
      matchState.selectedLeft = null;
      matchState.selectedRight = null;
      renderMatchUI(lKey, rKey);
      setTimeout(() => renderMatchUI(), 500);
      return;
    }
  }
  renderMatchUI();
}

function renderMatchUI(errL = null, errR = null) {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div style="text-align:center; font-size:12px; color:var(--muted); margin-bottom:8px;">
      Соедини 5 пар одним пальцем (${matchState.matchedKeys.size}/5)
    </div>
    <div class="match-grid">
      <div class="match-col">
        ${matchState.left.map(item => {
          const isMatched = matchState.matchedKeys.has(item.g);
          const isSel = matchState.selectedLeft === item.g;
          const isErr = errL === item.g;
          return `<div class="match-tile ${isMatched ? 'matched' : ''} ${isSel ? 'selected' : ''} ${isErr ? 'error' : ''}"
            onclick="clickMatchTile('left', '${item.g.replace(/'/g, "\\'")}')">${item.g.split(' (')[0]}</div>`;
        }).join('')}
      </div>
      <div class="match-col">
        ${matchState.right.map(item => {
          const isMatched = matchState.matchedKeys.has(item.g);
          const isSel = matchState.selectedRight === item.g;
          const isErr = errR === item.g;
          return `<div class="match-tile ${isMatched ? 'matched' : ''} ${isSel ? 'selected' : ''} ${isErr ? 'error' : ''}"
            onclick="clickMatchTile('right', '${item.g.replace(/'/g, "\\'")}')">${item.r}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// ================= MAIN RENDER =================
function renderMain(skipSound = false) {
  updateHeaderStats();
  const main = document.getElementById('mainContent');
  const deck = getActiveDeck();
  const item = deck[cardCursor % deck.length];

  if (activeTab === 'swipe') {
    const promptText = dirELtoRU ? item.g : item.r;
    const answerText = dirELtoRU ? item.r : item.g;
    const statusBadge = statusMap[item.g] === 'hard' ? '🔥 На повторе' : (statusMap[item.g] === 'known' ? '✅ Выучено' : '🆕 Новое');

    if (autoTTS && !skipSound && dirELtoRU) speakGreek(item.g);

    main.innerHTML = `
      <div class="swipe-wrapper">
        <div class="flashcard" id="swipeCard" onclick="flipSwipeCard()">
          <div class="card-top">
            <span class="cat-badge">${item.m} • ${(cardCursor % deck.length) + 1}/${deck.length}</span>
            <button class="speak-btn" onclick="event.stopPropagation(); speakGreek('${item.g.replace(/'/g, "\\'")}')" title="Произнести">🔊</button>
          </div>
          <div>
            <div style="font-size:11px; color:var(--muted); margin-bottom:4px;">${statusBadge}</div>
            <div class="word-main">${promptText}</div>
            ${dirELtoRU ? `<div class="word-grammar">${item.f}</div>` : ''}
          </div>
          <div class="divider"></div>
          <div class="reveal-zone">
            ${revealed ? `
              <div class="word-translation">${answerText}</div>
              ${!dirELtoRU ? `<div class="word-grammar">${item.f}</div>` : ''}
              <div class="word-example" onclick="event.stopPropagation(); speakGreek('${item.e.replace(/'/g, "\\'")}')">
                🔊 ${item.e}
              </div>
            ` : `
              <div class="tap-hint">👆 Тапни по карточке для перевода и примера<br><span style="font-size:11px; opacity:0.75">Свайп влево 👈 (Еще учу) | Свайп вправо 👉 (Знаю)</span></div>
            `}
          </div>
        </div>
      </div>
    `;
    attachTouchSwipe(document.getElementById('swipeCard'));
  }

  else if (activeTab === 'quiz') {
    const wrongPool = VOCAB.filter(v => v.g !== item.g).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [item, ...wrongPool].sort(() => Math.random() - 0.5);
    const question = dirELtoRU ? item.g : item.r;

    if (autoTTS && dirELtoRU) speakGreek(item.g);

    main.innerHTML = `
      <div class="quiz-card">
        <div class="card-top">
          <span class="cat-badge">${item.m}</span>
          <button class="speak-btn" onclick="speakGreek('${item.g.replace(/'/g, "\\'")}')">🔊</button>
        </div>
        <div class="word-main" style="font-size:22px; text-align:center; margin:6px 0;">${question}</div>
        ${dirELtoRU ? `<div style="text-align:center"><span class="word-grammar">${item.f}</span></div>` : ''}
        <div class="quiz-options">
          ${options.map(opt => {
            const label = dirELtoRU ? opt.r : opt.g;
            return `<button class="quiz-btn" data-correct="${opt.g === item.g}"
              onclick="handleQuizChoice(this, ${opt.g === item.g}, '${item.g.replace(/'/g, "\\'")}')">${label}</button>`;
          }).join('')}
        </div>
        <div style="font-size:12px; color:var(--muted); text-align:center; margin-top:4px;">
          Пример: ${item.e}
        </div>
      </div>
    `;
  }

  else if (activeTab === 'match') {
    if (!matchState.left || matchState.matchedKeys.size === matchState.left.length) {
      initMatchRound();
    }
    renderMatchUI();
  }

  else if (activeTab === 'templates') {
    main.innerHTML = `
      <div class="list-container">
        ${TEMPLATES.map(t => `
          <div style="background:var(--surface); border:1px solid var(--card-border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px;">
            <div>
              <div style="font-size:15px; font-weight:800; color:var(--accent);">${t.title}</div>
              <div style="font-size:12px; color:var(--muted);">${t.sub}</div>
            </div>
            ${t.blocks.map(b => `
              <div style="background:var(--bg); border-left:3px solid var(--accent-2); padding:9px 11px; border-radius:10px;">
                <div style="font-size:11px; font-weight:700; color:#fbbf24; margin-bottom:4px;">${b.label}</div>
                <div style="font-size:13.5px; font-weight:600; color:#fff; white-space:pre-line; line-height:1.35;" onclick="speakGreek(this.innerText)">${b.greek}</div>
                <div style="font-size:12px; color:var(--muted); margin-top:4px; white-space:pre-line;">${b.ru}</div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    `;
  }

  else if (activeTab === 'list') {
    const filtered = VOCAB.filter(v => {
      if (!searchQuery) return activeModule === '🔥 Умный микс' || activeModule === 'Все подряд' ? true : (activeModule === '❗️ Повторить' ? statusMap[v.g] === 'hard' : v.m === activeModule);
      const q = searchQuery.toLowerCase();
      return v.g.toLowerCase().includes(q) || v.r.toLowerCase().includes(q) || v.e.toLowerCase().includes(q);
    });

    main.innerHTML = `
      <div class="list-container">
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <input class="search-input" style="flex:1; min-width:160px; margin-bottom:0;" placeholder="🔍 Поиск (греч. / рус.)..." value="${searchQuery}" oninput="searchQuery=this.value; renderMain(true)">
          <button class="icon-btn" onclick="addCustomWordPrompt()" style="height:40px; border-color:var(--accent); color:var(--accent);">➕ Слово</button>
          <button class="icon-btn" onclick="backupProgressModal()" style="height:40px;">💾 Бэкап</button>
          <button class="icon-btn" onclick="if(confirm('Сбросить весь прогресс?')){statusMap={};saveStatus();renderMain(true);}" style="height:40px;">Сброс</button>
        </div>
        <div style="font-size:12px; color:var(--muted); margin-bottom:2px;">Найдено карточек: <b>${filtered.length}</b> (тапни 🔊 для озвучки)</div>
        ${filtered.map(v => `
          <div class="vocab-item">
            <div class="vocab-item-left">
              <div class="vocab-g">${v.g} <span style="font-size:11px; color:#fbbf24; font-weight:500;">(${v.f})</span></div>
              <div class="vocab-r">${v.r}</div>
              <div class="vocab-e">${v.e}</div>
            </div>
            <button class="speak-btn" style="flex-shrink:0;" onclick="speakGreek('${v.g.replace(/'/g, "\\'")}')">🔊</button>
          </div>
        `).join('')}
      </div>
    `;
  }
}

initCloudSync();
renderModules();
renderMain(true);
</script>
